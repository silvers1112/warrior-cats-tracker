<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tracker</title>

  <!-- Wilderness / Homepage Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="app-page">

  <!-- optional: show clan logo in corner here too (same id used by JS) -->
  <img id="clanLogo"
       class="clan-corner-logo"
       src=""
       alt="Clan logo"
       style="display:none;">

  <header class="app-header">
    <div id="welcome" class="profile-title"></div>
  </header>

  <section id="books-section">
    <h2 class="profile-subtitle">Book Tracker</h2>

    <label for="categoryFilter" class="profile-subtitle" style="font-size:1.1rem; text-transform:none;">
      Show:
    </label>
    <select id="categoryFilter"></select>

    <div id="books"></div>
  </section>

  <section id="community-section">
    <h3 class="profile-subtitle">Community Progress</h3>
    <div id="community"></div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>

  <div class="app-actions-bottom">
  <button class="forest-btn" onclick="location.href='profile.html'">
    Back to Profile
  </button>

  <button class="forest-btn" onclick="logOut()">
    Log Out
  </button>
</div>


</body>
</html>
