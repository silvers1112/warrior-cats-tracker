<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Warrior Cats Profile</title>

  <!-- Wilderness / Homepage Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">

  <!-- Clan logo in upper-left corner -->
  <img id="clanLogo"
       class="clan-corner-logo"
       src=""
       alt="Clan logo"
       style="display:none;">

  <header>
    <div id="welcome" class="profile-title"></div>
  </header>

  <section>
    <button class="forest-btn" onclick="location.href='app.html'">
      📚 Go to Book Tracker
    </button>
  </section>

  <section id="arc-progress-section">
    <h3 class="profile-subtitle">Arc Progress</h3>
    <div id="arcProgress"></div>
  </section>


  <section id="community-section">
    <h3>👥 Community Progress</h3>
    <div id="community"></div>
  </section>

  <div class="profile-footer">
    <button class="forest-btn" onclick="logOut()">Log Out</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>

</body>
</html>
