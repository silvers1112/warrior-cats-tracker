<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Warrior Profile</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">

  <!-- CHARACTER NAME -->
  <header>
    <div id="welcome"></div>
  </header>

  <!-- BIOGRAPHY -->
  <section class="bio-section">
    <textarea
      id="bioInput"
      placeholder="Write your warrior’s story..."
    ></textarea>

    <button class="forest-btn" onclick="publishBio()">Publish Bio</button>
    <div id="bioStatus"></div>
  </section>

  <!-- ARC PROGRESS -->
  <section>
    <h3 class="profile-subtitle">Arc Progress</h3>
    <div id="arcProgress"></div>
  </section>

  <!-- ACTIONS -->
  <div class="profile-actions">
    <button class="forest-btn" onclick="location.href='app.html'">📚 Book Tracker</button>
    <button class="forest-btn" onclick="location.href='community.html'">👥 Community</button>
    <button class="forest-btn" onclick="logOut()">Log Out</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- App -->
  <script src="script.js"></script>
</body>
</html>
