<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Warrior Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div id="welcome"></div>
  <button onclick="logOut()">Log Out</button>
</header>

<section>
  <h2>🐾 Your Character</h2>
  <p><strong>Name:</strong> <span id="profileName">Loading...</span></p>
  <p><strong>Clan:</strong> <span id="profileClan">Loading...</span></p>
</section>

<section>
  <h2>🖼️ Choose a Profile Portrait</h2>

  <img id="profileImg"
       src=""
       alt="Profile portrait"
       style="width:140px;height:140px;border-radius:50%;object-fit:cover;border:2px solid #333;display:none;">

  <p id="portraitMsg"></p>

  <div id="portraitGrid" style="display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;max-width:520px;margin:0 auto;">
    <button type="button" onclick="setPortrait('cat1')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat1.jpg" alt="Cat 1" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat2')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat2.jpg" alt="Cat 2" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat3')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat3.jpg" alt="Cat 3" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat4')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat4.jpg" alt="Cat 4" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat5')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat5.jpg" alt="Cat 5" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat6')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat6.jpg" alt="Cat 6" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat7')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat7.jpg" alt="Cat 7" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>

    <button type="button" onclick="setPortrait('cat8')" style="padding:0;border:none;background:none;cursor:pointer;">
      <img src="portraits/cat8.jpg" alt="Cat 8" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #ccc;">
    </button>
  </div>
</section>


<section>
  <button onclick="location.href='app.html'">📚 Go to Book Tracker</button>
</section>

<section id="community-section">
  <h3>👥 Community Progress</h3>
  <div id="community"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="script.js"></script>

</body>
</html>
